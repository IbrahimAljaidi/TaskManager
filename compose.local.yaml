# Optional two-service LOCAL DEVELOPMENT (production is ONE Docker image/cloud service).
# Prerequisites after Codex generates lockfiles: frontend/package-lock.json, backend/uv.lock.
services:
  frontend:
    image: node:22-bookworm-slim
    working_dir: /workspace
    volumes:
      - ./frontend:/workspace
      - frontend_node_modules:/workspace/node_modules
    command: sh -c "npm ci && npm run dev -- --hostname 0.0.0.0"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
  backend:
    image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
    working_dir: /workspace
    volumes:
      - ./backend:/workspace
    environment:
      TASKFLOW_DEV_CORS: "true"
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
    command: sh -c "uv sync --frozen && uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
volumes:
  frontend_node_modules:
