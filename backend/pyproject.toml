[project]
name = "taskflow-fastapi"
version = "0.1.0"
description = "TaskFlow browser-owned task AI orchestrator"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "httpx>=0.27,<1",
  "pydantic-settings>=2.8,<3",
  "tzdata>=2026.1",
]

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "ruff>=0.9,<1",
  "pytest-asyncio>=1,<2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
